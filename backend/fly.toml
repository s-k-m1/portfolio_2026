app = "skm-portfolio-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "False"
  ALLOWED_HOSTS = ".fly.dev"
  CORS_ALLOWED_ORIGINS = "https://frontend-six-alpha-12.vercel.app"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.concurrency]]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.tcp_checks]]
    interval = "15s"
    timeout = "2s"

  [[http_service.http_checks]]
    interval = "15s"
    timeout = "2s"
    path = "/"
    method = "get"
