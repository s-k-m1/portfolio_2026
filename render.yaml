# Render Blueprint — Portfolio Backend (Django REST API)
# Deploy: push repo to GitHub, then New → Blueprint → select the repo.
# The database is hosted on Neon — set DATABASE_URL in the dashboard as a secret
# (it is intentionally NOT committed here). The frontend is deployed on Vercel.

services:
  # Optional managed Redis (Render paid plans). If you enable this, change the
  # REDIS_URL env var below from `sync: false` to pull from this service:
  #   fromService:
  #     type: redis
  #     name: portfolio-redis
  #     property: connectionString
  # - type: redis
  #   name: portfolio-redis
  #   plan: free
  #   ipAllowList:
  #     - cidrBlock: 0.0.0.0/0
  #       description: everywhere
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_portfolio
    startCommand: gunicorn portfolio.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: ADMIN_URL
        value: dashboard
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-six-alpha-12.vercel.app
      - key: SECURE_SSL_REDIRECT
        value: "True"
      # Optional Redis cache — set REDIS_URL in the dashboard as a secret
      # (e.g. an Upstash Redis URL, or Render's managed Redis on paid plans).
      - key: REDIS_URL
        sync: false
      # Set this in the Render dashboard as a secret (Neon direct connection string)
      - key: DATABASE_URL
        sync: false
      - key: CONTACT_EMAIL
        value: mr.skm05@gmail.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        value: mr.skm05@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: mr.skm05@gmail.com
